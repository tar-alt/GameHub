<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBERVERSE - Player Login</title>
  <style>
    :root {
      --bg: #070913;
      --card-bg: rgba(18, 22, 41, 0.85);
      --primary: #00f0ff;
      --accent: #8028ff;
      --text: #f0f4f8;
      --subtext: #8a99ad;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .brand-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 11px;
      color: var(--subtext);
      letter-spacing: 1px;
      margin-top: 4px;
      margin-bottom: 28px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 11px;
      color: var(--subtext);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .input-group input:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #00d2ff, #7000ff);
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .status-msg {
      margin-top: 16px;
      font-size: 12px;
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-title">CYBERVERSE</div>
    <div class="subtitle">PLAYER VERIFICATION SYSTEM</div>

    <form id="loginForm">
      <div class="input-group">
        <label>PLAYER ID</label>
        <input type="text" id="playerId" placeholder="Enter Player ID" required>
      </div>

      <div class="input-group">
        <label>PASSCODE</label>
        <input type="password" id="passcode" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">LOGIN TO GAME</button>
    </form>

    <div id="statusMsg" class="status-msg"></div>
  </div>

  <!-- Firebase SDK v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // သင့်ထံမှ ရရှိသော Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyBtzNu_DH6ZEwIeB3BZsWaXBimvvBgfvVs",
      authDomain: "cyberverse-auth.firebaseapp.com",
      databaseURL: "https://cyberverse-auth-default-rtdb.firebaseio.com",
      projectId: "cyberverse-auth",
      storageBucket: "cyberverse-auth.firebasestorage.app",
      messagingSenderId: "612837208145",
      appId: "1:612837208145:web:6684e61c56a3059bc1c870"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const id = document.getElementById('playerId').value.trim();
      const pass = document.getElementById('passcode').value.trim();
      const statusDiv = document.getElementById('statusMsg');

      if (!id) return;

      statusDiv.innerText = "Sending request to Admin...";

      // Firebase ထဲသို့ Player Request ပို့ခြင်း
      db.ref('player_requests/' + id).set({
        playerId: id,
        passcode: pass,
        status: 'Pending',
        timestamp: new Date().toLocaleTimeString()
      }).then(() => {
        statusDiv.innerText = "Request Sent! Waiting for Admin Approval...";
      }).catch((err) => {
        statusDiv.innerText = "Error: " + err.message;
      });
    });
  </script>
</body>
</html>
