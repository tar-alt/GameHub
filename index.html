<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberVerse Game Auth</title>
  <style>
    :root {
      --bg-color: #0b0d19;
      --card-bg: rgba(20, 24, 45, 0.65);
      --primary-neon: #00f0ff;
      --secondary-neon: #7000ff;
      --accent-glow: rgba(0, 240, 255, 0.35);
      --text-color: #f0f4f8;
      --subtext-color: #8a99ad;
      --error-color: #ff3366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg-color); min-height: 100vh; display: flex; justify-content: center; align-items: center; color: var(--text-color); position: relative; overflow: hidden; }

    .bg-glow-1, .bg-glow-2 { position: absolute; border-radius: 50%; filter: blur(120px); z-index: 0; }
    .bg-glow-1 { width: 450px; height: 450px; background: var(--primary-neon); opacity: 0.2; top: 10%; left: 15%; }
    .bg-glow-2 { width: 500px; height: 500px; background: var(--secondary-neon); opacity: 0.25; bottom: 10%; right: 15%; }

    .auth-card {
      position: relative; z-index: 10; width: 100%; max-width: 420px; padding: 40px 32px;
      background: var(--card-bg); backdrop-filter: blur(20px); border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-title { font-size: 28px; font-weight: 800; letter-spacing: 2px; background: linear-gradient(135deg, var(--primary-neon), #fff, var(--secondary-neon)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-subtitle { font-size: 12px; color: var(--subtext-color); margin-top: 4px; }

    .form-panel { display: none; }
    .form-panel.active { display: block; animation: fadeIn 0.4s ease forwards; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .input-group { margin-bottom: 18px; }
    .input-group label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--subtext-color); margin-bottom: 8px; letter-spacing: 1px; }
    .input-field { width: 100%; padding: 14px 16px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #fff; font-size: 14px; outline: none; }
    .input-field:focus { border-color: var(--primary-neon); box-shadow: 0 0 15px var(--accent-glow); }

    .forgot-link { display: block; text-align: right; font-size: 12px; color: var(--primary-neon); text-decoration: none; margin-top: -8px; margin-bottom: 16px; cursor: pointer; }

    .glow-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon)); color: #fff; font-size: 14px; font-weight: 700; letter-spacing: 1px; cursor: pointer; margin-top: 10px; }

    .status-box { text-align: center; padding: 10px 0; }
    .status-title { font-size: 18px; font-weight: 700; color: var(--primary-neon); margin-bottom: 8px; }
    .status-desc { font-size: 13px; color: var(--subtext-color); line-height: 1.5; }
    .badge { display: inline-block; margin-top: 14px; padding: 6px 16px; background: rgba(0, 240, 255, 0.1); border: 1px solid var(--primary-neon); border-radius: 20px; font-weight: bold; }
    .error-msg { color: var(--error-color); font-size: 12px; margin-top: 6px; display: none; }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="auth-card">
    <div class="brand-header">
      <div class="brand-title">CYBERVERSE</div>
      <div class="brand-subtitle">ADMIN VERIFICATION SYSTEM</div>
    </div>

    <!-- STEP 1: LOGIN FORM -->
    <div id="loginPanel" class="form-panel active">
      <div class="input-group">
        <label>Player ID</label>
        <input type="text" id="loginId" class="input-field" placeholder="Enter Player ID">
      </div>
      <div class="input-group">
        <label>Passcode</label>
        <input type="password" id="loginPass" class="input-field" placeholder="••••••••">
      </div>
      <span class="forgot-link" onclick="switchPanel('forgotPanel')">Forgot Passcode?</span>
      <button class="glow-btn" onclick="handleLoginSubmit()">LOGIN TO GAME</button>
    </div>

    <!-- STEP 2: FORGOT PASSCODE / RE-ENTER ID -->
    <div id="forgotPanel" class="form-panel">
      <p style="font-size: 12px; color: var(--subtext-color); margin-bottom: 16px;">Re-enter your Player ID to send a verification request to Admin.</p>
      <div class="input-group">
        <label>Confirm Player ID</label>
        <input type="text" id="confirmId" class="input-field" placeholder="Re-enter Player ID">
        <div id="idError" class="error-msg">IDs do not match! Please check again.</div>
      </div>
      <button class="glow-btn" onclick="handleVerificationSubmit()">SEND TO ADMIN</button>
      <span class="forgot-link" style="text-align: center; margin-top: 14px;" onclick="switchPanel('loginPanel')">Back to Login</span>
    </div>

    <!-- STEP 3: PENDING APPROVAL SCREEN -->
    <div id="pendingPanel" class="form-panel">
      <div class="status-box">
        <div style="font-size: 36px; margin-bottom: 8px;">⏳</div>
        <div class="status-title">WAITING FOR ADMIN</div>
        <div class="status-desc">Your ID request has been sent to the Admin.<br>Access will be granted once Admin approves.</div>
        <div class="badge" id="displayId">ID: -------</div>
      </div>
      <button class="glow-btn" style="background: rgba(255,255,255,0.1); margin-top: 20px;" onclick="checkStatus()">CHECK APPROVAL STATUS</button>
    </div>
  </div>

  <script>
    let firstEnteredId = "";

    function switchPanel(panelId) {
      document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
      document.getElementById(panelId).classList.add('active');
    }

    function handleLoginSubmit() {
      firstEnteredId = document.getElementById('loginId').value.trim();
      const pass = document.getElementById('loginPass').value;

      if (!firstEnteredId || !pass) {
        alert("Please enter both Player ID and Passcode.");
        return;
      }
      alert("Authenticating request with Admin...");
    }

    function handleVerificationSubmit() {
      const secondEnteredId = document.getElementById('confirmId').value.trim();
      const errorDiv = document.getElementById('idError');

      if (!firstEnteredId) {
        alert("Please enter your Player ID in the Login screen first.");
        switchPanel('loginPanel');
        return;
      }

      // ID နှစ်ခု တူမတူ စစ်ဆေးခြင်း
      if (firstEnteredId !== secondEnteredId) {
        errorDiv.style.display = "block";
        return;
      }

      errorDiv.style.display = "none";
      document.getElementById('displayId').innerText = `ID: ${firstEnteredId}`;
      
      // Admin Backend သို့ ပို့ပေးမည့်နေရာ
      sendToAdmin(firstEnteredId);
      switchPanel('pendingPanel');
    }

    function sendToAdmin(id) {
      console.log(`Submitted Player ID [${id}] to Admin Dashboard Queue.`);
    }

    function checkStatus() {
      alert("Checking status with Admin...");
    }
  </script>
</body>
</html>
