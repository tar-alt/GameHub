<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Auth System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
      color: #fff;
      padding: 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 35px 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .tab-btn.active {
      color: #38bdf8;
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 2px;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(15, 23, 42, 0.6);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: 0.3s ease;
    }

    .form-group input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .actions a {
      color: #38bdf8;
      text-decoration: none;
      transition: 0.2s;
    }

    .actions a:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Modal Style (OTP / Reset) */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      width: 90%;
      max-width: 380px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 15px; right: 15px;
      color: #94a3b8;
      cursor: pointer;
      font-size: 18px;
    }

    .otp-inputs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
    }

    .otp-inputs input {
      width: 45px;
      height: 50px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(15, 23, 42, 0.8);
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <!-- Tab Switches -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <div id="login-form" class="form-section active">
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email သို့မဟုတ် ဖုန်းနံပါတ်</label>
          <input type="text" placeholder="example@domain.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="••••••••" required>
        </div>
        <div class="actions">
          <a href="#" onclick="openOtpModal()">Password မေ့နေသလား / OTP ဖြင့်ဝင်မည်</a>
        </div>
        <button type="submit" class="btn-submit">Login ဝင်မည်</button>
      </form>
    </div>

    <!-- Register Form -->
    <div id="register-form" class="form-section">
      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>အမည်</label>
          <input type="text" placeholder="Your Name" required>
        </div>
        <div class="form-group">
          <label>Email သို့မဟုတ် ဖုန်းနံပါတ်</label>
          <input type="text" placeholder="example@domain.com" required>
        </div>
        <div class="form-group">
          <label>Password အသစ်</label>
          <input type="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-submit">အကောင့်သစ်ဖွင့်မည်</button>
      </form>
    </div>
  </div>

  <!-- OTP Modal -->
  <div id="otp-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeOtpModal()">&times;</span>
      <h3 style="margin-bottom: 10px; font-size: 18px;">OTP ဖြင့် အကောင့်ဝင်ရန်</h3>
      <p style="font-size: 12px; color: #94a3b8; margin-bottom: 15px;">
        ဖုန်းနံပါတ်/Email ရိုက်ထည့်ပြီး OTP တောင်းဆိုပါ
      </p>

      <div id="otp-step-1">
        <div class="form-group">
          <input type="text" id="otp-target" placeholder="ဖုန်းနံပါတ် သို့မဟုတ် Email">
        </div>
        <button type="button" class="btn-submit" onclick="sendOtpCode()">OTP ကုဒ်တောင်းမည်</button>
      </div>

      <div id="otp-step-2" style="display: none;">
        <p style="font-size: 13px; color: #38bdf8; text-align: center;">ကျလာသော OTP ၄ လုံး ရိုက်ထည့်ပါ</p>
        <div class="otp-inputs">
          <input type="text" maxlength="1" oninput="moveFocus(this, 1)">
          <input type="text" maxlength="1" oninput="moveFocus(this, 2)">
          <input type="text" maxlength="1" oninput="moveFocus(this, 3)">
          <input type="text" maxlength="1" oninput="moveFocus(this, 4)">
        </div>
        <button type="button" class="btn-submit" onclick="verifyOtp()">အတည်ပြု၍ Login ဝင်မည်</button>
      </div>
    </div>
  </div>

  <script>
    // Tab switching logic
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));

      if (tab === 'login') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('login-form').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('register-form').classList.add('active');
      }
    }

    // Modal Control
    function openOtpModal() {
      document.getElementById('otp-modal').style.display = 'flex';
    }

    function closeOtpModal() {
      document.getElementById('otp-modal').style.display = 'none';
      document.getElementById('otp-step-1').style.display = 'block';
      document.getElementById('otp-step-2').style.display = 'none';
    }

    // OTP Flow (Simulated)
    function sendOtpCode() {
      const target = document.getElementById('otp-target').value;
      if (!target) {
        alert('ကျေးဇူးပြု၍ ဖုန်းနံပါတ် သို့မဟုတ် Email ရိုက်ထည့်ပါ');
        return;
      }
      alert('OTP ကုဒ် ပို့ပေးလိုက်ပါပြီ (Demo: 1234)');
      document.getElementById('otp-step-1').style.display = 'none';
      document.getElementById('otp-step-2').style.display = 'block';
    }

    function moveFocus(element, index) {
      if (element.value.length === 1 && index < 4) {
        document.querySelectorAll('.otp-inputs input')[index].focus();
      }
    }

    function verifyOtp() {
      alert('OTP အတည်ပြုပြီးပါပြီ။ Login အောင်မြင်ပါသည်။');
      closeOtpModal();
    }

    function handleLogin(e) {
      e.preventDefault();
      alert('Login အောင်မြင်ပါသည်။');
    }

    function handleRegister(e) {
      e.preventDefault();
      alert('အကောင့်သစ် ပြုလုပ်ပြီးပါပြီ။');
    }
  </script>
</body>
</html>
