<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERVERSE ADMIN</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f293d; padding-bottom: 15px; margin-bottom: 20px; }
        .title { font-size: 18px; font-weight: bold; color: #38bdf8; }
        .admin-info { font-size: 12px; color: #64748b; }
        .section-title { font-size: 11px; color: #94a3b8; letter-spacing: 1px; margin-bottom: 15px; }
        .requests-list { display: flex; flex-direction: column; gap: 10px; }
        .request-card { background: #121824; border: 1px solid #1f293d; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .player-id { color: #38bdf8; font-weight: bold; font-size: 14px; }
        .passcode { color: #94a3b8; font-size: 12px; margin-top: 4px; }
        .no-requests { font-size: 13px; color: #64748b; margin-top: 20px; }
        .btn-group { display: flex; gap: 8px; }
        .btn { padding: 6px 12px; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: 600; }
        .btn-approve { background: #10b981; color: #fff; }
        .btn-reject { background: #ef4444; color: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">CYBERVERSE ADMIN</div>
        <div class="admin-info">Logged as: SuperAdmin</div>
    </div>

    <div class="section-title">LIVE PLAYER REQUESTS</div>

    <div id="requestsContainer" class="requests-list">
        <div class="no-requests">Waiting for player requests...</div>
    </div>

    <script>
        const DB_URL = "https://cyberverse-auth-default-rtdb.asia-southeast1.firebasedatabase.app";
        const requestsContainer = document.getElementById('requestsContainer');

        async function fetchRequests() {
            try {
                const response = await fetch(`${DB_URL}/player_requests.json`);
                const data = await response.json();

                requestsContainer.innerHTML = '';

                if (!data) {
                    requestsContainer.innerHTML = '<div class="no-requests">Waiting for player requests...</div>';
                    return;
                }

                Object.keys(data).forEach(key => {
                    const req = data[key];
                    const card = document.createElement('div');
                    card.className = 'request-card';
                    card.innerHTML = `
                        <div>
                            <div class="player-id">ID: ${req.playerId}</div>
                            <div class="passcode">Passcode: ${req.passcode}</div>
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-approve" onclick="approvePlayer('${req.playerId}')">Approve</button>
                            <button class="btn btn-reject" onclick="deleteRequest('${req.playerId}')">Remove</button>
                        </div>
                    `;
                    requestsContainer.appendChild(card);
                });
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        async function deleteRequest(playerId) {
            await fetch(`${DB_URL}/player_requests/${playerId}.json`, { method: 'DELETE' });
            fetchRequests();
        }

        function approvePlayer(playerId) {
            alert('Approved Player: ' + playerId);
        }

        // Poll every 3 seconds for new requests
        setInterval(fetchRequests, 3000);
        fetchRequests();
    </script>
</body>
</html>
