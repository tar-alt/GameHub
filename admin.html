<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBERVERSE ADMIN PANEL</title>
  <style>
    :root {
      --bg: #060814;
      --card-bg: rgba(18, 22, 41, 0.9);
      --primary: #00f0ff;
      --success: #00ffa3;
      --danger: #ff3366;
      --warning: #ffb703;
      --text: #f0f4f8;
      --subtext: #8a99ad;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }

    .title { font-size: 18px; font-weight: 800; color: var(--primary); }
    .admin-tag { font-size: 11px; color: var(--subtext); }

    .section-title {
      font-size: 12px;
      letter-spacing: 1px;
      color: var(--subtext);
      margin-bottom: 12px;
    }

    .player-card {
      background: var(--card-bg);
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .id-tag { font-size: 18px; font-weight: bold; color: var(--primary); }

    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .status-pending { background: rgba(255, 183, 3, 0.2); color: var(--warning); border: 1px solid var(--warning); }
    .status-active { background: rgba(0, 255, 163, 0.2); color: var(--success); border: 1px solid var(--success); }
    .status-banned { background: rgba(255, 51, 102, 0.2); color: var(--danger); border: 1px solid var(--danger); }

    .btn-group { display: flex; gap: 8px; margin-top: 12px; }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-approve { background: var(--success); color: #000; }
    .btn-block { background: var(--danger); color: #fff; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">CYBERVERSE ADMIN</div>
    <div class="admin-tag">Logged as: SuperAdmin</div>
  </div>

  <div class="section-title">LIVE PLAYER REQUESTS</div>

  <div id="playerContainer">
    <p style="color: var(--subtext); font-size: 13px;">Waiting for player requests...</p>
  </div>

  <!-- Firebase SDK v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBtzNu_DH6ZEwIeB3BZsWaXBimvvBgfvVs",
      authDomain: "cyberverse-auth.firebaseapp.com",
      databaseURL: "https://cyberverse-auth-default-rtdb.firebaseio.com",
      projectId: "cyberverse-auth",
      storageBucket: "cyberverse-auth.firebasestorage.app",
      messagingSenderId: "612837208145",
      appId: "1:1234567890:web:abcdef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Database မှ Player Requests များကို Live နားထောင်ခြင်း
    db.ref('player_requests').on('value', (snapshot) => {
      const container = document.getElementById('playerContainer');
      container.innerHTML = "";

      const data = snapshot.val();
      if (!data) {
        container.innerHTML = '<p style="color: var(--subtext); font-size: 13px;">No requests found.</p>';
        return;
      }

      Object.keys(data).forEach((key) => {
        const player = data[key];
        const statusLower = (player.status || 'pending').toLowerCase();

        const card = `
          <div class="player-card">
            <div class="card-row">
              <span style="font-size: 11px; color: var(--subtext);">PLAYER ID</span>
              <span class="id-tag">${player.playerId}</span>
            </div>
            <div class="card-row">
              <span style="font-size: 11px; color: var(--subtext);">PASSCODE: ${player.passcode || '-'}</span>
              <span class="badge status-${statusLower}">${player.status}</span>
            </div>
            <div class="btn-group">
              <button class="btn btn-approve" onclick="updateStatus('${player.playerId}', 'Active')">APPROVE</button>
              <button class="btn btn-block" onclick="updateStatus('${player.playerId}', 'Banned')">BLOCK</button>
            </div>
          </div>
        `;
        container.innerHTML += card;
      });
    });

    // Admin Action ကို Database ထဲ Update လုပ်ခြင်း
    function updateStatus(playerId, newStatus) {
      db.ref('player_requests/' + playerId).update({
        status: newStatus
      });
    }
  </script>
</body>
</html>
